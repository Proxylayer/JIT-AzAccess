name: Publish plugin

# Publishes the AzureTray.Plugin.JITAzAccess .nupkg to nuget.org.
# Modeled on the AzureTray host's publish-plugins.yml, collapsed to the
# single plugin this repo ships. Three triggers:
#   - Tag push like `v0.3.1`
#       → authoritative: builds the plugin at the tag's version
#         (overriding the csproj <Version>) and pushes to NuGet.
#   - Branch push to `release` with changes inside the plugin folder
#       → opportunistic: builds at the csproj <Version>;
#         --skip-duplicate makes it a no-op if that version is already
#         on NuGet.
#       This said `main` until now. There is no `main` in this repository —
#       the default branch is `release` — so the opportunistic path had
#       never once fired, while reading as though it had.
#
# NOTE on the trigger shape: `paths:` used to sit under `push:`, but a path
# filter applies to EVERY push event, tags included. So a `v*` tag on a commit
# that happened not to touch the plugin folder matched the tag trigger and was
# then filtered straight back out — the workflow never ran, silently, which
# contradicts the "the tag IS the version-of-record" contract above. The path
# filter is now applied per-event in the job instead: tags and manual runs
# always publish, branch pushes publish only when the plugin folder changed.
#   - workflow_dispatch → manual run with an optional version override
#     (for retry / out-of-band republish).
#
# Tag-driven is the recommended workflow because the tag IS the
# version-of-record. Bumping the csproj <Version> is optional and
# historical-only — useful for keeping the checked-in state in sync with
# what shipped, but not required for the publish itself.

on:
  push:
    branches: [release]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override (leave blank to use the csproj <Version>)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write       # for attest-build-provenance
  attestations: write   # for attest-build-provenance

concurrency:
  group: publish-plugin
  cancel-in-progress: false

env:
  CSPROJ: src/plugin/AzureTray.Plugin.JITAzAccess/AzureTray.Plugin.JITAzAccess.csproj

jobs:
  # Replaces the old `paths:` trigger filter, which also (wrongly) applied to
  # tag pushes. A tag push or a manual run always proceeds; a branch push only
  # when the plugin folder actually changed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.should.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Should this run publish?
        id: should
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          $run = $true

          if ($env:EVENT_NAME -eq 'push' -and $env:REF -notlike 'refs/tags/*') {
            $run = $false

            # Reasons the "before" SHA can be unusable - all of which should
            # publish rather than skip:
            #   - a brand-new branch: GitHub sends all zeros.
            #   - a force-push after a history rewrite: GitHub sends the real
            #     previous SHA, but that commit no longer exists here, so a
            #     diff against it aborts with "bad object". That used to fail
            #     the step *after* it had already decided correctly to skip,
            #     turning a clean no-op into a red run on the default branch.
            $beforeUsable = -not ([string]::IsNullOrWhiteSpace($env:BEFORE) -or
                                  $env:BEFORE -match '^0{40}$')
            if ($beforeUsable) {
              git cat-file -e "$($env:BEFORE)^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                Write-Host "'before' SHA $env:BEFORE is no longer in this repository."
                $beforeUsable = $false
              }
            }

            if (-not $beforeUsable) {
              Write-Host "No usable 'before' SHA - running."
              $run = $true
            } else {
              $changed = git diff --name-only "$env:BEFORE" "$env:SHA"
              if ($changed | Where-Object { $_ -like 'src/plugin/AzureTray.Plugin.JITAzAccess/*' }) {
                Write-Host "Plugin folder changed - running."
                $run = $true
              } else {
                Write-Host "Branch push did not touch the plugin folder - skipping."
              }
            }
          }

          "run=$($run.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # The decision is carried by the output above. Keep the step's own
          # exit status from inheriting whatever git last left in
          # $LASTEXITCODE.
          exit 0

  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink needs history

      # Resolve trigger → optional version override. A tag push and a manual
      # override both pin an explicit version; a branch push leaves it blank
      # so the csproj <Version> is used.
      - name: Resolve version
        id: pick
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = ''

          if ($env:EVENT_NAME -eq 'push' -and $env:REF -like 'refs/tags/*') {
            # Tag push: parse `v<version>` from the tag name. Anything that
            # doesn't match is rejected loudly — a tag is meant to ship
            # something specific; ambiguity isn't safe.
            $tag = $env:REF -replace '^refs/tags/', ''
            if ($tag -match '^v(?<ver>.+)$') {
              $version = $Matches['ver']
              Write-Host "Tag-driven publish: version=$version" -ForegroundColor Cyan
            } else {
              throw "Tag '$tag' doesn't match expected pattern 'v<version>'."
            }
          }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            $version = $env:MANUAL_VERSION.Trim()
            Write-Host "Manual publish (override): version=$version" -ForegroundColor Cyan
          }
          else {
            Write-Host "Publish at csproj <Version>." -ForegroundColor Cyan
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore $env:CSPROJ

      - name: Build (Release)
        shell: pwsh
        env:
          PIN_VERSION: ${{ steps.pick.outputs.version }}
        run: |
          # Tag-driven and manual-override paths supply an explicit version;
          # pass it as /p:Version so AssemblyFileVersion,
          # AssemblyInformationalVersion, and PackageVersion all line up.
          # Branch-push leaves the csproj <Version> as-is.
          if ([string]::IsNullOrWhiteSpace($env:PIN_VERSION)) {
            dotnet build $env:CSPROJ --configuration Release --no-restore
          } else {
            dotnet build $env:CSPROJ --configuration Release --no-restore /p:Version=$env:PIN_VERSION
          }

      - name: Pack
        shell: pwsh
        env:
          PIN_VERSION: ${{ steps.pick.outputs.version }}
        run: |
          if (-not (Test-Path NuGet)) { New-Item -ItemType Directory -Path NuGet | Out-Null }
          if ([string]::IsNullOrWhiteSpace($env:PIN_VERSION)) {
            Write-Host "Packing at csproj <Version> ..." -ForegroundColor Cyan
            dotnet pack $env:CSPROJ --configuration Release --no-build --output NuGet
          } else {
            Write-Host "Packing at pinned version $env:PIN_VERSION ..." -ForegroundColor Cyan
            dotnet pack $env:CSPROJ --configuration Release --no-build --output NuGet /p:Version=$env:PIN_VERSION
          }
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $env:CSPROJ" }

      - name: Upload nupkg as artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: NuGet/*.nupkg
          if-no-files-found: error

      # Best effort, deliberately NOT a release blocker.
      #
      # GitHub only persists attestations for a private repository on a paid
      # plan, so on this one the step fails with "Feature not available for
      # the Proxylayer organization". It runs BEFORE the push, so until now it
      # aborted the job and nothing was ever published - the v0.9.0 tag failed
      # the same way, and that release reached nuget.org by some other route.
      #
      # Provenance is worth having and worth keeping attempted, so that making
      # the repo public or upgrading the plan starts producing it with no
      # change here. It is not worth refusing to ship a security fix over, so
      # its failure is recorded loudly and the release continues.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: NuGet/*.nupkg

      - name: Report provenance outcome
        shell: pwsh
        run: |
          if ('${{ steps.attest.outcome }}' -eq 'success') {
            Write-Host 'Build provenance attested.'
          } else {
            # An annotation, so it is visible on the run rather than buried.
            Write-Host '::warning title=No build provenance::This package was published WITHOUT a provenance attestation. GitHub only persists attestations for private repositories on a paid plan. Make the repository public or upgrade the plan to restore it.'
          }

      # Previously this set an "enabled" flag and the push step was skipped
      # when the secret was absent — so a release tag produced a fully GREEN
      # run that published nothing. A publish workflow that cannot publish is
      # a failure; it must say so. The same rule holds for OIDC below: a
      # failed exchange fails the run.
      #
      # TRUSTED PUBLISHING. There is no NUGET_API_KEY secret and there should
      # not be one. nuget.org's "JIT-Publish" policy trusts this exact
      # repository and workflow file, and this step exchanges the job's
      # short-lived GitHub OIDC token for an API key that expires in minutes.
      # Nothing long-lived is stored in the repository, so there is no secret
      # to leak, rotate, or forget to rotate.
      #
      # Two things this depends on, both easy to break by accident:
      #   * `id-token: write` in the job permissions above. It is already
      #     there for attest-build-provenance; removing it breaks publishing
      #     too.
      #   * The policy is bound to the WORKFLOW FILENAME. Renaming this file
      #     silently invalidates it, and the push will start failing 403.
      - name: Exchange OIDC token for a short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          # The nuget.org username that CREATED the trust policy, which is not
          # the same field as the package owner shown beside it. Setting the
          # owner organisation here fails the exchange with
          # "No matching trust policy owned by user 'ProxyLayer' was found".
          user: jbland

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "The OIDC exchange returned no API key, so this run cannot publish. Check the nuget.org trusted-publishing policy still names this repository and workflow file."
          }

          # --skip-duplicate keeps the push idempotent: a branch-push run that
          # didn't bump the csproj's <Version> is a no-op rather than a
          # workflow failure. Tag-driven and manual-override runs are expected
          # to be unique versions.
          $packages = Get-ChildItem NuGet\*.nupkg | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "nuget push failed for $($pkg.Name)" }
          }
